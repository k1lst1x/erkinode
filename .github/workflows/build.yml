name: Build desktop artifacts
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Confirm native runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch !== process.env.EXPECTED_ARCH) throw new Error('Runner architecture mismatch')"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm native:setup
      - run: pnpm check
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify macOS application signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          release_dir="release/$(node -p "require('./package.json').version")"
          app="$(find "$release_dir" -maxdepth 2 -type d -name Erkinode.app -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements :- "$app" > /tmp/erkinode-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' /tmp/erkinode-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' /tmp/erkinode-entitlements.plist | grep -qx true
      - run: node scripts/stage-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/staged/*
          if-no-files-found: error
          retention-days: 14
