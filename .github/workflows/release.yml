name: Publish desktop release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Require the release commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Release commit must be contained in origin/main" >&2
            exit 1
          }
      - run: node scripts/release-meta.mjs
  package:
    needs: metadata
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  publish:
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Prepare and validate release files
        run: node scripts/prepare-release.mjs release-assets
      - name: Attest all seven release artifacts and the checksum manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release-assets/Erkinode-*
            release-assets/SHA256SUMS.txt
      - name: Validate all installers and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
